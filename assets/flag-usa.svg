    <circle cx="2.0" cy="5.6" r="0.45"/><circle cx="4.4" cy="5.6" r="0.45"/><circle cx="6.8" cy="5.6" r="0.45"/>
    <circle cx="9.2" cy="5.6" r="0.45"/><circle cx="11.6" cy="5.6" r="0.45"/><circle cx="14.0" cy="5.6" r="0.45"/>
